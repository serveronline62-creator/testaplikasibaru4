<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Mask Editor Studio</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    :root {
        --bg-app: #16161a; --bg-panel: #1e1e24; --bg-panel-alt: #26262e;
        --bg-input: #131316; --bg-hover: #2f2f38; --border: #2e2e36;
        --text: #d5d5dc; --text-dim: #7a7a88; --text-bright: #ffffff;
        --accent: #5b8def; --accent-glow: rgba(91,141,239,0.25);
        --danger: #ef5350; --success: #66bb6a; --warning: #ffa726; --purple: #ab47bc;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg-app); color: var(--text); overflow: hidden; font-size: 13px; }
    .app { display: grid; grid-template-rows: 52px 1fr 30px; height: 100vh; }

    .topbar { display: flex; align-items: center; justify-content: space-between;
        padding: 0 16px; background: #1a1a1f; border-bottom: 1px solid var(--border); gap: 12px; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px;
        color: var(--text-bright); flex-shrink: 0; }
    .logo-icon { width: 30px; height: 30px;
        background: linear-gradient(135deg, #5b8def, #ab47bc);
        border-radius: 7px; display: flex; align-items: center; justify-content: center;
        font-size: 16px; box-shadow: 0 0 12px rgba(91,141,239,0.4); }
    .topbar-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }

    .btn { display: inline-flex; align-items: center; gap: 6px;
        padding: 7px 14px; border: 1px solid var(--border);
        background: var(--bg-panel-alt); color: var(--text);
        border-radius: 6px; cursor: pointer; font-size: 12.5px; font-weight: 500;
        transition: all 0.15s; white-space: nowrap; font-family: inherit; }
    .btn:hover:not(:disabled) { background: var(--bg-hover); border-color: #4a4a55; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 12px var(--accent-glow); }
    .btn-primary:hover:not(:disabled) { background: #4a7add; }
    .btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
    .btn-danger:hover:not(:disabled) { background: #d32f2f; }
    .btn-sm { padding: 4px 10px; font-size: 11px; }

    .quality-select { padding: 7px 10px; background: var(--bg-panel-alt);
        border: 1px solid var(--border); color: var(--text); border-radius: 6px;
        font-size: 12.5px; font-family: inherit; cursor: pointer; outline: none;
        transition: all 0.15s; }
    .quality-select:hover:not(:disabled) { background: var(--bg-hover); }
    .quality-select:focus { border-color: var(--accent); }
    .quality-select:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-record { background: #3a1f1f; border-color: #5a2a2a; color: #ff8a80; }
    .btn-record:hover:not(:disabled) { background: #4a2a2a; border-color: var(--danger); }
    .btn-record.recording { background: var(--danger); border-color: var(--danger); color: #fff;
        animation: pulse-recording 1.5s infinite; }
    @keyframes pulse-recording {
        0%, 100% { box-shadow: 0 0 0 0 rgba(239,83,80,0.7); }
        50% { box-shadow: 0 0 0 8px rgba(239,83,80,0); }
    }

    .record-time { display: inline-flex; align-items: center; gap: 6px;
        padding: 6px 12px; background: rgba(239,83,80,0.15);
        border: 1px solid var(--danger); border-radius: 6px; color: var(--danger);
        font-size: 12px; font-family: 'SF Mono', 'Monaco', monospace; font-weight: 600;
        letter-spacing: 0.5px; }
    .record-time::before { content: ''; width: 8px; height: 8px; background: var(--danger);
        border-radius: 50%; animation: blink 1s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .main { display: grid; grid-template-columns: 240px 1fr 320px; overflow: hidden; }
    .sidebar { background: var(--bg-panel); overflow-y: auto; display: flex; flex-direction: column; }
    .sidebar-left { border-right: 1px solid var(--border); }
    .sidebar-right { border-left: 1px solid var(--border); }

    .panel-section { border-bottom: 1px solid var(--border); padding: 14px; }
    .panel-title { font-size: 10.5px; font-weight: 600; text-transform: uppercase;
        letter-spacing: 1px; color: var(--text-dim); margin-bottom: 12px;
        display: flex; align-items: center; gap: 6px; }

    .upload-item { background: var(--bg-panel-alt); border: 1.5px dashed var(--border);
        border-radius: 8px; padding: 12px; margin-bottom: 10px; transition: all 0.2s; }
    .upload-item.filled { border-style: solid; border-color: var(--success); background: rgba(102,187,106,0.08); }
    .upload-item label { display: block; font-size: 12px; color: var(--text); margin-bottom: 8px; font-weight: 600; }
    .upload-item input[type="file"] { width: 100%; font-size: 11px; color: var(--text-dim); }
    .upload-item input[type="file"]::file-selector-button {
        background: var(--bg-hover); border: 1px solid var(--border); color: var(--text);
        padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px;
        margin-right: 8px; font-family: inherit; }
    .upload-item input[type="file"]::file-selector-button:hover { background: #3a3a45; }

    .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .tool-btn { display: flex; align-items: center; gap: 6px; padding: 9px 10px;
        background: var(--bg-panel-alt); border: 1px solid var(--border);
        border-radius: 6px; cursor: pointer; font-size: 12px; color: var(--text);
        transition: all 0.15s; font-family: inherit; }
    .tool-btn:hover { background: var(--bg-hover); }
    .tool-btn.active { background: var(--accent-glow); border-color: var(--accent); color: var(--accent); }
    .tool-btn.active[data-tool="erase"] { background: rgba(239,83,80,0.2); border-color: var(--danger); color: var(--danger); }
    .tool-btn.active[data-tool="restore"] { background: rgba(102,187,106,0.2); border-color: var(--success); color: var(--success); }
    .tool-btn.active[data-tool="transform"] { background: rgba(171,71,188,0.2); border-color: var(--purple); color: var(--purple); }
    .tool-btn .emoji { font-size: 14px; }

    .preview-area { background: repeating-conic-gradient(#0f0f12 0% 25%, #131318 0% 50%) 50% / 20px 20px;
        display: flex; align-items: center; justify-content: center;
        padding: 20px; overflow: hidden; }
    .preview-wrapper { position: relative; max-width: 100%; max-height: 100%;
        display: flex; align-items: center; justify-content: center; }
    .preview-wrapper canvas {
        max-width: 100%; max-height: 100%; height: auto; width: auto;
        display: block; background: #000; border-radius: 10px;
        box-shadow: 0 12px 48px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.05);
        transition: box-shadow 0.3s; }
    #cursor-overlay { position: absolute; pointer-events: none;
        border: 2px dashed var(--danger); border-radius: 50%; display: none;
        box-shadow: 0 0 0 1px rgba(255,255,255,0.5); background: rgba(239,83,80,0.1); }
    #cursor-overlay.restore { border-color: var(--success); background: rgba(102,187,106,0.1); }
    .empty-state { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        text-align: center; color: var(--text-dim); pointer-events: none; }
    .empty-state .icon { font-size: 56px; margin-bottom: 14px; opacity: 0.4; }
    .empty-state .text { font-size: 14px; letter-spacing: 0.3px; }
    .preview-controls { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
        display: none; gap: 6px; padding: 6px;
        background: rgba(20,20,25,0.92); border: 1px solid var(--border);
        border-radius: 24px; backdrop-filter: blur(12px);
        box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
    .preview-controls .btn { padding: 6px 14px; border-radius: 20px; border-color: transparent; background: transparent; }
    .preview-controls .btn:hover:not(:disabled) { background: var(--bg-hover); }

    .preview-wrapper.recording canvas {
        box-shadow: 0 12px 48px rgba(0,0,0,0.7), 0 0 0 3px var(--danger), 0 0 20px rgba(239,83,80,0.5); }

    .tabs { display: flex; border-bottom: 1px solid var(--border); background: #1a1a1f; }
    .tab-btn { flex: 1; padding: 12px 8px; background: transparent; border: none;
        color: var(--text-dim); font-size: 12px; font-weight: 600;
        cursor: pointer; position: relative; transition: color 0.15s; font-family: inherit; }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--accent); }
    .tab-btn.active::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0;
        height: 2px; background: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
    .tab-content { display: none; padding: 16px; flex: 1; overflow-y: auto; }
    .tab-content.active { display: block; }

    .control-group { margin-bottom: 22px; }
    .control-group-title { font-size: 11px; font-weight: 600; text-transform: uppercase;
        letter-spacing: 0.6px; color: var(--text-dim); margin-bottom: 12px;
        display: flex; align-items: center; justify-content: space-between; }
    .slider-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .slider-row label { min-width: 65px; font-size: 12px; color: var(--text); font-weight: 500; }
    .slider-row input[type="range"] { flex: 1; -webkit-appearance: none; appearance: none;
        height: 4px; background: var(--bg-input); border-radius: 2px; outline: none; cursor: pointer; }
    .slider-row input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none;
        width: 15px; height: 15px; background: var(--accent); border-radius: 50%;
        cursor: pointer; border: 2px solid #1a1a1f;
        box-shadow: 0 0 0 1px var(--accent), 0 0 8px var(--accent-glow);
        transition: transform 0.1s; }
    .slider-row input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }
    .slider-row input[type="range"]::-moz-range-thumb {
        width: 15px; height: 15px; background: var(--accent); border-radius: 50%;
        cursor: pointer; border: 2px solid #1a1a1f; }
    .slider-row .value { min-width: 60px; text-align: right; font-size: 11px; color: var(--text-dim);
        font-variant-numeric: tabular-nums; font-family: 'SF Mono', 'Monaco', monospace; }

    .toggle-row { display: flex; align-items: center; gap: 10px;
        margin-top: 10px; padding: 9px 10px;
        background: var(--bg-panel-alt); border-radius: 6px; }
    .toggle-row input[type="checkbox"] {
        -webkit-appearance: none; appearance: none;
        width: 34px; height: 19px; background: var(--bg-input); border-radius: 10px;
        position: relative; cursor: pointer; transition: all 0.2s;
        border: 1px solid var(--border); flex-shrink: 0; }
    .toggle-row input[type="checkbox"]::after {
        content: ''; position: absolute;
        width: 13px; height: 13px; background: var(--text-dim); border-radius: 50%;
        top: 2px; left: 2px; transition: all 0.2s; }
    .toggle-row input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
    .toggle-row input[type="checkbox"]:checked::after { background: #fff; left: 17px; }
    .toggle-row label { font-size: 12px; color: var(--text); cursor: pointer; flex: 1; }

    .statusbar { display: flex; align-items: center; padding: 0 16px;
        background: #131316; border-top: 1px solid var(--border);
        font-size: 11.5px; color: var(--text-dim); gap: 8px; }
    .statusbar .dot { width: 7px; height: 7px; border-radius: 50%;
        background: var(--success); flex-shrink: 0; box-shadow: 0 0 6px var(--success); }
    .statusbar.error { color: var(--danger); }
    .statusbar.error .dot { background: var(--danger); box-shadow: 0 0 6px var(--danger); }
    .statusbar.success { color: var(--success); }
    .statusbar.warning { color: var(--warning); }
    .statusbar.warning .dot { background: var(--warning); box-shadow: 0 0 6px var(--warning); }

    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2f2f38; border-radius: 5px; border: 2px solid var(--bg-panel); }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f4a; }

    @media (max-width: 1080px) {
        .topbar-actions .btn { padding: 7px 10px; font-size: 12px; }
    }
    @media (max-width: 900px) {
        .main { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
        .sidebar { max-height: 220px; border: none !important; border-bottom: 1px solid var(--border) !important; }
        .sidebar-right { border-top: 1px solid var(--border) !important; }
    }
</style>
</head>
<body>
<div class="app">
    <header class="topbar">
        <div class="logo">
            <div class="logo-icon">🎬</div>
            <span>Video Mask Editor</span>
        </div>
        <div class="topbar-actions">
            <span id="record-time" class="record-time" style="display:none;">00:00</span>
            <select id="aspect-select" class="quality-select" title="Format layar">
                <option value="original" selected>Asli</option>
                <option value="9:16">9:16 (Portrait)</option>
                <option value="19:9">19:9 (Ultrawide)</option>
            </select>
            <select id="quality-select" class="quality-select" title="Resolusi rekaman">
                <option value="SD">SD 480p</option>
                <option value="HD" selected>HD 720p</option>
                <option value="FULLHD">Full HD 1080p</option>
            </select>
            <button id="btn-play" class="btn" disabled>▶ Play</button>
            <button id="btn-pause" class="btn" disabled>⏸ Pause</button>
            <button id="btn-reset" class="btn" disabled>↺</button>
            <button id="btn-record" class="btn btn-record" disabled>⏺ Record</button>
            <button id="btn-export" class="btn btn-danger" disabled>⬇ Export</button>
        </div>
    </header>

    <main class="main">
        <aside class="sidebar sidebar-left">
            <section class="panel-section">
                <div class="panel-title">📥 Sources</div>
                <div class="upload-item" id="box-back">
                    <label>🎥 Video Belakang</label>
                    <input type="file" id="file-back" accept="video/*">
                </div>
                <div class="upload-item" id="box-front">
                    <label>🎭 Video Depan</label>
                    <input type="file" id="file-front" accept="video/*">
                </div>
            </section>
            <section class="panel-section">
                <div class="panel-title">🛠 Tools</div>
                <div class="tool-grid">
                    <button class="tool-btn active" data-tool="view"><span class="emoji">👁</span> View</button>
                    <button class="tool-btn" data-tool="transform"><span class="emoji">🔲</span> Transform</button>
                    <button class="tool-btn" data-tool="erase"><span class="emoji">🧽</span> Eraser</button>
                    <button class="tool-btn" data-tool="restore"><span class="emoji">↩</span> Restore</button>
                </div>
            </section>
        </aside>

        <section class="preview-area">
            <div class="preview-wrapper" id="preview-wrapper">
                <canvas id="canvas" width="1280" height="720"></canvas>
                <div id="cursor-overlay"></div>
                <div class="empty-state" id="empty-state">
                    <div class="icon">📺</div>
                    <div class="text">Unggah kedua video untuk memulai</div>
                </div>
                <div class="preview-controls" id="preview-controls">
                    <button id="btn-play-float" class="btn" disabled>▶</button>
                    <button id="btn-pause-float" class="btn" disabled>⏸</button>
                    <button id="btn-reset-float" class="btn" disabled>↺</button>
                </div>
            </div>
        </section>

        <aside class="sidebar sidebar-right">
            <div class="tabs">
                <button class="tab-btn active" data-tab="tab-transform">Transform</button>
                <button class="tab-btn" data-tab="tab-mask">Mask</button>
                <button class="tab-btn" data-tab="tab-eraser">Eraser</button>
            </div>

            <div class="tab-content active" id="tab-transform">
                <div class="control-group">
                    <div class="control-group-title">
                        <span>🖼 Video Belakang</span>
                        <button id="btn-reset-back" class="btn btn-sm" disabled>Reset</button>
                    </div>
                    <div class="slider-row"><label>Skala</label>
                        <input type="range" id="back-scale" min="10" max="500" value="100"><span class="value" id="back-scale-v">100%</span></div>
                    <div class="slider-row"><label>Geser X</label>
                        <input type="range" id="back-x" min="-2560" max="2560" value="0"><span class="value" id="back-x-v">0 px</span></div>
                    <div class="slider-row"><label>Geser Y</label>
                        <input type="range" id="back-y" min="-1440" max="1440" value="0"><span class="value" id="back-y-v">0 px</span></div>
                </div>
                <div class="control-group">
                    <div class="control-group-title">
                        <span>🎭 Video Depan</span>
                        <button id="btn-reset-front" class="btn btn-sm" disabled>Reset</button>
                    </div>
                    <div class="slider-row"><label>Skala</label>
                        <input type="range" id="front-scale" min="10" max="500" value="100"><span class="value" id="front-scale-v">100%</span></div>
                    <div class="slider-row"><label>Geser X</label>
                        <input type="range" id="front-x" min="-2560" max="2560" value="0"><span class="value" id="front-x-v">0 px</span></div>
                    <div class="slider-row"><label>Geser Y</label>
                        <input type="range" id="front-y" min="-1440" max="1440" value="0"><span class="value" id="front-y-v">0 px</span></div>
                </div>
            </div>

            <div class="tab-content" id="tab-mask">
                <div class="control-group">
                    <div class="control-group-title">🔲 Rect Mask</div>
                    <div class="slider-row"><label>Posisi X</label>
                        <input type="range" id="mx" min="0" max="1280" value="100"><span class="value" id="mx-v">100 px</span></div>
                    <div class="slider-row"><label>Posisi Y</label>
                        <input type="range" id="my" min="0" max="720" value="100"><span class="value" id="my-v">100 px</span></div>
                    <div class="slider-row"><label>Lebar</label>
                        <input type="range" id="mw" min="50" max="1280" value="600"><span class="value" id="mw-v">600 px</span></div>
                    <div class="slider-row"><label>Tinggi</label>
                        <input type="range" id="mh" min="50" max="720" value="400"><span class="value" id="mh-v">400 px</span></div>
                    <div class="slider-row"><label>Sudut</label>
                        <input type="range" id="mr" min="0" max="200" value="0"><span class="value" id="mr-v">0 px</span></div>
                    <div class="toggle-row">
                        <input type="checkbox" id="rect-enabled" checked>
                        <label for="rect-enabled">Aktifkan batas kotak</label>
                    </div>
                    <div class="toggle-row">
                        <input type="checkbox" id="invert">
                        <label for="invert">Balik mask kotak</label>
                    </div>
                </div>
            </div>

            <div class="tab-content" id="tab-eraser">
                <div class="control-group">
                    <div class="control-group-title">🧽 Eraser Brush</div>
                    <div class="slider-row"><label>Ukuran</label>
                        <input type="range" id="eraser-size" min="5" max="360" value="60"><span class="value" id="eraser-size-v">60 px</span></div>
                    <button id="btn-clear-eraser" class="btn" style="width:100%; margin-top:14px; justify-content:center;" disabled>
                        🧹 Bersihkan Semua Eraser
                    </button>
                </div>
            </div>
        </aside>
    </main>

    <footer class="statusbar" id="statusbar">
        <span class="dot"></span>
        <span id="status">Siap. Unggah kedua video untuk memulai.</span>
    </footer>
</div>

<script>
const $ = id => document.getElementById(id);
const canvas = $('canvas');
const ctx = canvas.getContext('2d');
const maskCanvas = document.createElement('canvas');
const maskCtx = maskCanvas.getContext('2d');
const offCanvas = document.createElement('canvas');
const offCtx = offCanvas.getContext('2d');
const recordCanvas = document.createElement('canvas');
const recordCtx = recordCanvas.getContext('2d');
const cursorOverlay = $('cursor-overlay');
const emptyState = $('empty-state');
const previewControls = $('preview-controls');
const previewWrapper = $('preview-wrapper');
const statusbar = $('statusbar');

const videoBack = document.createElement('video');
const videoFront = document.createElement('video');
[videoBack, videoFront].forEach(v => { v.muted = true; v.playsInline = true; });

let backLoaded = false, frontLoaded = false;
let rafId = null, isExporting = false, isRecording = false;
let currentTool = 'view';
let eraserSize = 60;
let isDrawing = false, lastX = null, lastY = null;
let dragState = null;
let mediaRecorder = null;
let recordChunks = [];
let recordStartTime = 0;
let recordTimerInterval = null;

const MAX_DIM = 1280;

const ALL_BTN_IDS = ['btn-play', 'btn-pause', 'btn-reset', 'btn-record', 'btn-export',
    'btn-play-float', 'btn-pause-float', 'btn-reset-float',
    'btn-clear-eraser', 'btn-reset-back', 'btn-reset-front'];

function setStatus(msg, type = '') {
    $('status').textContent = msg;
    statusbar.className = 'statusbar' + (type ? ' ' + type : '');
}

function setAllButtonsEnabled(enabled) {
    ALL_BTN_IDS.forEach(id => { if ($(id)) $(id).disabled = !enabled; });
}

// ===== ASPECT & DIMENSIONS =====
function getAspectRatio() {
    const mode = $('aspect-select').value;
    if (mode === 'original') {
        if (backLoaded && videoBack.videoWidth) {
            return videoBack.videoWidth / videoBack.videoHeight;
        }
        return 16 / 9;
    }
    if (mode === '9:16') return 9 / 16;
    if (mode === '19:9') return 19 / 9;
    return 16 / 9;
}

function getCanvasDimensions() {
    const aspect = getAspectRatio();
    let w, h;
    if (aspect >= 1) {
        w = MAX_DIM;
        h = Math.round(MAX_DIM / aspect);
    } else {
        h = MAX_DIM;
        w = Math.round(MAX_DIM * aspect);
    }
    w -= w % 2;
    h -= h % 2;
    return { w, h, aspect };
}

function getRecordDimensions(quality) {
    const aspect = getAspectRatio();
    const baseShort = quality === 'SD' ? 480 : quality === 'HD' ? 720 : 1080;
    let w, h;
    if (aspect >= 1) {
        h = baseShort;
        w = Math.round(baseShort * aspect);
    } else {
        w = baseShort;
        h = Math.round(baseShort / aspect);
    }
    w -= w % 2;
    h -= h % 2;
    return { w, h, aspect, label: `${w}×${h}` };
}

// ===== UTILS =====
function roundedRectPath(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    if (r <= 0) { c.rect(x, y, w, h); return; }
    c.moveTo(x + r, y); c.lineTo(x + w - r, y);
    c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r);
    c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r);
    c.quadraticCurveTo(x, y, x + r, y);
    c.closePath();
}

function resizeCanvases(w, h) {
    canvas.width = w; canvas.height = h;
    maskCanvas.width = w; maskCanvas.height = h;
    offCanvas.width = w; offCanvas.height = h;
    maskCtx.clearRect(0, 0, w, h);

    // Update slider maksimum
    $('eraser-size').max = Math.min(w, h);
    ['mx', 'mw'].forEach(id => $(id).max = w);
    ['my', 'mh'].forEach(id => $(id).max = h);
    $('mr').max = Math.min(w, h) / 2;

    // Update transform offset ranges (offset = -size sampai +size)
    ['back', 'front'].forEach(p => {
        $(p + '-x').min = -w; $(p + '-x').max = w;
        $(p + '-y').min = -h; $(p + '-y').max = h;
    });

    // Clamp nilai slider yang sekarang mungkin di luar batas baru
    ['mx', 'mw', 'my', 'mh', 'mr'].forEach(id => {
        const el = $(id);
        let v = parseFloat(el.value);
        v = Math.max(parseFloat(el.min), Math.min(parseFloat(el.max), v));
        el.value = v;
        updateSliderLabel(id);
    });
    ['back', 'front'].forEach(p => {
        ['x', 'y'].forEach(axis => {
            const el = $(p + '-' + axis);
            let v = parseFloat(el.value);
            v = Math.max(parseFloat(el.min), Math.min(parseFloat(el.max), v));
            el.value = v;
            updateSliderLabel(p + '-' + axis);
        });
    });
    $('eraser-size').value = Math.min(eraserSize, +$('eraser-size').max);
    eraserSize = +$('eraser-size').value;
    $('eraser-size-v').textContent = eraserSize + ' px';
}

// ===== TRANSFORM =====
function getFrontRect() {
    const w = canvas.width, h = canvas.height;
    const vw = videoFront.videoWidth || w, vh = videoFront.videoHeight || h;
    const scale = parseFloat($('front-scale').value) / 100;
    const offsetX = parseFloat($('front-x').value);
    const offsetY = parseFloat($('front-y').value);
    const fitRatio = Math.min(w / vw, h / vh);
    const baseW = vw * fitRatio, baseH = vh * fitRatio;
    const drawW = baseW * scale, drawH = baseH * scale;
    return { drawX: (w - drawW) / 2 + offsetX, drawY: (h - drawH) / 2 + offsetY, drawW, drawH, baseW, baseH };
}

function getHandleSizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    return 12 * (canvas.width / (rect.width || canvas.width));
}

function hitTest(x, y) {
    if (!frontLoaded) return null;
    const r = getFrontRect();
    const hs = getHandleSizeCanvas() / 2 + 2;
    const corners = [
        { name: 'tl', x: r.drawX, y: r.drawY },
        { name: 'tr', x: r.drawX + r.drawW, y: r.drawY },
        { name: 'bl', x: r.drawX, y: r.drawY + r.drawH },
        { name: 'br', x: r.drawX + r.drawW, y: r.drawY + r.drawH },
    ];
    for (const c of corners) {
        if (Math.abs(x - c.x) <= hs && Math.abs(y - c.y) <= hs) return c.name;
    }
    if (x >= r.drawX && x <= r.drawX + r.drawW && y >= r.drawY && y <= r.drawY + r.drawH) return 'body';
    return null;
}

function drawVideoTransformed(context, video, prefix) {
    const w = canvas.width, h = canvas.height;
    const vw = video.videoWidth || w, vh = video.videoHeight || h;
    const scale = parseFloat($(prefix + '-scale').value) / 100;
    const offsetX = parseFloat($(prefix + '-x').value);
    const offsetY = parseFloat($(prefix + '-y').value);
    const fitRatio = Math.min(w / vw, h / vh);
    const baseW = vw * fitRatio, baseH = vh * fitRatio;
    const drawW = baseW * scale, drawH = baseH * scale;
    const drawX = (w - drawW) / 2 + offsetX;
    const drawY = (h - drawH) / 2 + offsetY;
    context.drawImage(video, drawX, drawY, drawW, drawH);
}

// ===== RENDER =====
function drawBaseScene() {
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, w, h);

    if (backLoaded && videoBack.readyState >= 2) {
        drawVideoTransformed(ctx, videoBack, 'back');
    }

    if (frontLoaded && videoFront.readyState >= 2) {
        offCtx.clearRect(0, 0, w, h);
        offCtx.save();
        if ($('rect-enabled').checked) {
            const mx = +$('mx').value, my = +$('my').value;
            const mw = +$('mw').value, mh = +$('mh').value, mr = +$('mr').value;
            offCtx.beginPath();
            if ($('invert').checked) {
                offCtx.rect(0, 0, w, h);
                roundedRectPath(offCtx, mx, my, mw, mh, mr);
                offCtx.clip('evenodd');
            } else {
                roundedRectPath(offCtx, mx, my, mw, mh, mr);
                offCtx.clip();
            }
        }
        drawVideoTransformed(offCtx, videoFront, 'front');
        offCtx.restore();

        offCtx.globalCompositeOperation = 'destination-out';
        offCtx.drawImage(maskCanvas, 0, 0);
        offCtx.globalCompositeOperation = 'source-over';
        ctx.drawImage(offCanvas, 0, 0);

        if ($('rect-enabled').checked) {
            const mx = +$('mx').value, my = +$('my').value;
            const mw = +$('mw').value, mh = +$('mh').value, mr = +$('mr').value;
            ctx.save();
            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 6]);
            ctx.beginPath();
            roundedRectPath(ctx, mx, my, mw, mh, mr);
            ctx.stroke();
            ctx.restore();
        }
    }
}

function drawTransformHandles() {
    if (currentTool !== 'transform' || !frontLoaded) return;
    const r = getFrontRect();
    const hs = getHandleSizeCanvas();
    ctx.save();
    ctx.strokeStyle = '#ab47bc';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.strokeRect(r.drawX, r.drawY, r.drawW, r.drawH);
    ctx.setLineDash([]);
    ctx.fillStyle = '#ab47bc';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    [
        { x: r.drawX, y: r.drawY },
        { x: r.drawX + r.drawW, y: r.drawY },
        { x: r.drawX, y: r.drawY + r.drawH },
        { x: r.drawX + r.drawW, y: r.drawY + r.drawH },
    ].forEach(c => {
        ctx.beginPath();
        ctx.rect(c.x - hs / 2, c.y - hs / 2, hs, hs);
        ctx.fill(); ctx.stroke();
    });
    ctx.restore();
}

function drawFrame() { drawBaseScene(); drawTransformHandles(); }

function renderLoop() {
    drawBaseScene();
    if ((isRecording || isExporting) && recordCanvas.width) {
        recordCtx.drawImage(canvas, 0, 0, recordCanvas.width, recordCanvas.height);
    }
    drawTransformHandles();
    rafId = requestAnimationFrame(renderLoop);
}
function startLoop() { if (rafId) cancelAnimationFrame(rafId); rafId = requestAnimationFrame(renderLoop); }
function stopLoop() { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }

function getCanvasCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
    };
}

function paintMask(x, y, prevX, prevY) {
    maskCtx.save();
    maskCtx.globalCompositeOperation = currentTool === 'erase' ? 'source-over' : 'destination-out';
    maskCtx.fillStyle = '#000'; maskCtx.strokeStyle = '#000';
    maskCtx.lineWidth = eraserSize;
    maskCtx.lineCap = 'round'; maskCtx.lineJoin = 'round';
    if (prevX !== null) {
        maskCtx.beginPath(); maskCtx.moveTo(prevX, prevY); maskCtx.lineTo(x, y); maskCtx.stroke();
    }
    maskCtx.beginPath(); maskCtx.arc(x, y, eraserSize / 2, 0, Math.PI * 2); maskCtx.fill();
    maskCtx.restore();
}

function loadVideoFile(file, videoEl, boxId) {
    return new Promise((resolve, reject) => {
        if (videoEl.src) URL.revokeObjectURL(videoEl.src);
        videoEl.src = URL.createObjectURL(file);
        videoEl.onloadedmetadata = () => {
            document.getElementById(boxId).classList.add('filled');
            resolve(videoEl);
        };
        videoEl.onerror = () => reject(new Error('Gagal memuat: ' + file.name));
    });
}

function whenBothLoaded() {
    if (!backLoaded || !frontLoaded) return;
    const dims = getCanvasDimensions();
    resizeCanvases(dims.w, dims.h);
    setAllButtonsEnabled(true);
    emptyState.style.display = 'none';
    previewControls.style.display = 'flex';
    drawFrame();
    setStatus(`✅ Video siap (${dims.w}×${dims.h}). Pilih tool dan mulai mengedit.`, 'success');
}

// ===== POINTER =====
function onPointerDown(e) {
    if (!backLoaded || !frontLoaded || isExporting) return;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const { x, y } = getCanvasCoords(clientX, clientY);

    if (currentTool === 'transform') {
        const hit = hitTest(x, y);
        if (!hit) return;
        e.preventDefault();
        const r = getFrontRect();
        dragState = {
            handle: hit, startX: x, startY: y,
            startScale: parseFloat($('front-scale').value),
            startOffsetX: parseFloat($('front-x').value),
            startOffsetY: parseFloat($('front-y').value),
            startDrawX: r.drawX, startDrawY: r.drawY,
            startDrawW: r.drawW, startDrawH: r.drawH,
            baseW: r.baseW, baseH: r.baseH,
        };
        return;
    }
    if (currentTool === 'view') return;
    e.preventDefault();
    isDrawing = true; lastX = x; lastY = y;
    paintMask(x, y, null, null);
    if (!rafId) drawFrame();
}

function onPointerMove(e) {
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const { x, y } = getCanvasCoords(clientX, clientY);

    if (dragState) {
        e.preventDefault();
        const ds = dragState;
        if (ds.handle === 'body') {
            setSliderValue('front-x', ds.startOffsetX + (x - ds.startX));
            setSliderValue('front-y', ds.startOffsetY + (y - ds.startY));
        } else {
            const dx = x - ds.startX, dy = y - ds.startY;
            const ratioW = (ds.startDrawW + dx) / ds.startDrawW;
            const ratioH = (ds.startDrawH + dy) / ds.startDrawH;
            const ratio = Math.abs(ratioW - 1) > Math.abs(ratioH - 1) ? ratioW : ratioH;
            let newScale = Math.max(10, Math.min(500, ds.startScale * ratio));
            let anchorX, anchorY;
            if (ds.handle === 'br') { anchorX = ds.startDrawX; anchorY = ds.startDrawY; }
            else if (ds.handle === 'tl') { anchorX = ds.startDrawX + ds.startDrawW; anchorY = ds.startDrawY + ds.startDrawH; }
            else if (ds.handle === 'tr') { anchorX = ds.startDrawX; anchorY = ds.startDrawY + ds.startDrawH; }
            else { anchorX = ds.startDrawX + ds.startDrawW; anchorY = ds.startDrawY; }
            const newW = ds.baseW * (newScale / 100);
            const newH = ds.baseH * (newScale / 100);
            const w = canvas.width, h = canvas.height;
            let newDrawX, newDrawY;
            if (ds.handle === 'br') { newDrawX = anchorX; newDrawY = anchorY; }
            else if (ds.handle === 'tl') { newDrawX = anchorX - newW; newDrawY = anchorY - newH; }
            else if (ds.handle === 'tr') { newDrawX = anchorX; newDrawY = anchorY - newH; }
            else { newDrawX = anchorX - newW; newDrawY = anchorY; }
            setSliderValue('front-scale', newScale, true);
            setSliderValue('front-x', newDrawX - (w - newW) / 2);
            setSliderValue('front-y', newDrawY - (h - newH) / 2);
        }
        drawFrame();
        return;
    }

    if (currentTool === 'transform') {
        const hit = hitTest(x, y);
        const cursors = { tl: 'nwse-resize', tr: 'nesw-resize', bl: 'nesw-resize', br: 'nwse-resize', body: 'move' };
        canvas.style.cursor = hit ? cursors[hit] : 'default';
        return;
    }

    if (currentTool !== 'view' && backLoaded && frontLoaded) {
        const rect = canvas.getBoundingClientRect();
        const sizeCss = eraserSize * (rect.width / canvas.width);
        cursorOverlay.style.width = sizeCss + 'px';
        cursorOverlay.style.height = sizeCss + 'px';
        cursorOverlay.style.left = (clientX - rect.left - sizeCss / 2) + 'px';
        cursorOverlay.style.top = (clientY - rect.top - sizeCss / 2) + 'px';
        cursorOverlay.classList.toggle('restore', currentTool === 'restore');
        const inside = clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom;
        cursorOverlay.style.display = inside ? 'block' : 'none';
    } else {
        cursorOverlay.style.display = 'none';
    }

    if (!isDrawing) return;
    e.preventDefault();
    paintMask(x, y, lastX, lastY);
    lastX = x; lastY = y;
    if (!rafId) drawFrame();
}

function onPointerUp() { isDrawing = false; lastX = null; lastY = null; dragState = null; }

canvas.addEventListener('mousedown', onPointerDown);
canvas.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);
canvas.addEventListener('mouseleave', () => { if (currentTool !== 'view' && currentTool !== 'transform') cursorOverlay.style.display = 'none'; });
canvas.addEventListener('touchstart', onPointerDown, { passive: false });
canvas.addEventListener('touchmove', onPointerMove, { passive: false });
canvas.addEventListener('touchend', onPointerUp);

// ===== PLAY / PAUSE / RESET =====
function doPlay() {
    if (!backLoaded || !frontLoaded) return;
    try {
        if (videoBack.ended) videoBack.currentTime = 0;
        if (videoFront.ended) videoFront.currentTime = 0;
        Promise.all([videoBack.play(), videoFront.play()]).then(() => {
            startLoop(); setStatus(isRecording ? '▶ Memutar (sambil merekam)...' : '▶ Memutar...');
        });
    } catch (err) { setStatus('❌ ' + err.message, 'error'); }
}
function doPause() {
    videoBack.pause(); videoFront.pause();
    if (!isRecording) stopLoop();
    drawFrame();
    setStatus(isRecording ? '⏸ Dijeda (rekaman tetap berjalan).' : '⏸ Dijeda.');
}
function doReset() {
    videoBack.pause(); videoFront.pause();
    videoBack.currentTime = 0; videoFront.currentTime = 0;
    if (!isRecording) stopLoop();
    drawFrame();
    setStatus(isRecording ? '↺ Video di-reset (rekaman tetap berjalan).' : '↺ Video di-reset.');
}
$('btn-play').onclick = doPlay;
$('btn-play-float').onclick = doPlay;
$('btn-pause').onclick = doPause;
$('btn-pause-float').onclick = doPause;
$('btn-reset').onclick = doReset;
$('btn-reset-float').onclick = doReset;

$('btn-clear-eraser').onclick = () => {

    if (!rafId) drawFrame();
    setStatus('🧹 Semua coretan eraser dibersihkan.', 'success');
};

// ===== SLIDER UTILS =====
function setSliderValue(id, val, isFloat = false) {
    const el = $(id);
    let v = isFloat ? parseFloat(val) : Math.round(val);
    v = Math.max(parseFloat(el.min), Math.min(parseFloat(el.max), v));
    el.value = v;
    updateSliderLabel(id);
}
function updateSliderLabel(id) {
    const el = $(id);
    const label = $(id + '-v');
    if (!label) return;
    if (id.endsWith('-scale')) label.textContent = Math.round(parseFloat(el.value)) + '%';
    else label.textContent = Math.round(parseFloat(el.value)) + ' px';
}
function resetTransform(prefix) {
    $(prefix + '-scale').value = 100;
    $(prefix + '-x').value = 0;
    $(prefix + '-y').value = 0;
    ['scale', 'x', 'y'].forEach(k => updateSliderLabel(prefix + '-' + k));
    if (!rafId) drawFrame();
}
$('btn-reset-back').onclick = () => { resetTransform('back'); setStatus('🖼 Transform video belakang di-reset.', 'success'); };
$('btn-reset-front').onclick = () => { resetTransform('front'); setStatus('🎭 Transform video depan di-reset.', 'success'); };

['mx', 'my', 'mw', 'mh', 'mr'].forEach(id => {
    $(id).addEventListener('input', () => { $(id + '-v').textContent = $(id).value + ' px'; if (!rafId) drawFrame(); });
});
['back', 'front'].forEach(p => {
    $(p + '-scale').addEventListener('input', () => { $(p + '-scale-v').textContent = $(p + '-scale').value + '%'; if (!rafId) drawFrame(); });
    ['x', 'y'].forEach(axis => {
        $(p + '-' + axis).addEventListener('input', () => { $(p + '-' + axis + '-v').textContent = $(p + '-' + axis).value + ' px'; if (!rafId) drawFrame(); });
    });
});
$('eraser-size').addEventListener('input', () => {
    eraserSize = +$('eraser-size').value;
    $('eraser-size-v').textContent = eraserSize + ' px';
});
$('rect-enabled').addEventListener('change', () => { if (!rafId) drawFrame(); });
$('invert').addEventListener('change', () => { if (!rafId) drawFrame(); });

// ===== RECORDING =====
function getBestMime() {
    const types = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
    for (const t of types) if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
    return null;
}

function getBitrate(quality) {
    return quality === 'SD' ? 2500000 : quality === 'HD' ? 5000000 : 10000000;
}

function setupRecordCanvas(quality) {
    const dims = getRecordDimensions(quality);
    recordCanvas.width = dims.w;
    recordCanvas.height = dims.h;
    recordCtx.fillStyle = '#000';
    recordCtx.fillRect(0, 0, dims.w, dims.h);
    drawBaseScene();
    recordCtx.drawImage(canvas, 0, 0, dims.w, dims.h);
    return dims;
}

function formatTime(ms) {
    const totalSec = Math.floor(ms / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function startRecording() {
    if (isRecording) return;
    if (isExporting) { setStatus('⚠️ Tunggu export selesai.', 'warning'); return; }
    if (!window.MediaRecorder) { setStatus('❌ Browser tidak mendukung MediaRecorder.', 'error'); return; }
    if (!backLoaded || !frontLoaded) { setStatus('❌ Video belum dimuat.', 'error'); return; }

    const mimeType = getBestMime();
    if (!mimeType) { setStatus('❌ Format WebM tidak didukung.', 'error'); return; }

    const quality = $('quality-select').value;
    const dims = setupRecordCanvas(quality);

    recordChunks = [];
    const stream = recordCanvas.captureStream(30);

    try {
        mediaRecorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: getBitrate(quality) });
    } catch (err) {
        setStatus('❌ Gagal membuat recorder: ' + err.message, 'error');
        return;
    }

    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordChunks.push(e.data); };
    mediaRecorder.onstop = () => {
        const blob = new Blob(recordChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `video-mask-${quality}-${dims.w}x${dims.h}-${Date.now()}.webm`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        setStatus(`✅ Rekaman ${quality} (${dims.w}×${dims.h}) selesai! File telah diunduh.`, 'success');
    };

    videoBack.currentTime = 0;
    videoFront.currentTime = 0;
    Promise.all([videoBack.play(), videoFront.play()]).catch(() => {});
    if (!rafId) startLoop();
    mediaRecorder.start(100);

    isRecording = true;
    previewWrapper.classList.add('recording');
    $('btn-record').classList.add('recording');
    $('btn-record').textContent = '⏹ Stop';

    // Kunci pilihan format & export agar file tidak rusak
    $('aspect-select').disabled = true;
    $('quality-select').disabled = true;
    $('btn-export').disabled = true;

    recordStartTime = Date.now();
    $('record-time').style.display = 'inline-flex';
    $('record-time').textContent = '00:00';
    clearInterval(recordTimerInterval);
    recordTimerInterval = setInterval(() => {
        if (!isRecording) return;
        $('record-time').textContent = formatTime(Date.now() - recordStartTime);
    }, 250);

    setStatus(`🔴 Merekam ${quality} (${dims.w}×${dims.h})... Semua tool tetap aktif.`, 'warning');
}

function stopRecording() {
    if (!isRecording) return;
    if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();

    isRecording = false;
    previewWrapper.classList.remove('recording');
    $('btn-record').classList.remove('recording');
    $('btn-record').textContent = '⏺ Record';
    clearInterval(recordTimerInterval);
    $('record-time').style.display = 'none';

    $('aspect-select').disabled = false;
    $('quality-select').disabled = false;
    $('btn-export').disabled = false;

    if (videoBack.paused && videoFront.paused) stopLoop();
    setStatus('⏹ Rekaman dihentikan. File sedang diproses...', 'warning');
}

videoBack.addEventListener('ended', () => { if (isRecording) setTimeout(stopRecording, 200); });
$('btn-record').onclick = () => { if (isRecording) stopRecording(); else startRecording(); };

// ===== EXPORT =====
$('btn-export').onclick = async () => {
    if (isExporting) return;
    if (isRecording) { setStatus('⚠️ Hentikan rekaman dulu.', 'warning'); return; }
    if (!window.MediaRecorder) { setStatus('❌ Browser tidak mendukung MediaRecorder.', 'error'); return; }
    const duration = Math.min(videoBack.duration, videoFront.duration);
    if (!isFinite(duration) || duration <= 0) { setStatus('❌ Durasi video tidak valid.', 'error'); return; }

    const quality = $('quality-select').value;
    const dims = setupRecordCanvas(quality);
    const mimeType = getBestMime();
    if (!mimeType) { setStatus('❌ Format WebM tidak didukung.', 'error'); return; }

    isExporting = true;
    setAllButtonsEnabled(false);
    $('aspect-select').disabled = true;
    $('quality-select').disabled = true;

    const chunks = [];
    const stream = recordCanvas.captureStream(30);
    const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: getBitrate(quality) });
    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `video-mask-${quality}-${dims.w}x${dims.h}-${Date.now()}.webm`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        setStatus(`✅ Export ${quality} (${dims.w}×${dims.h}) selesai!`, 'success');
        isExporting = false;
        setAllButtonsEnabled(true);
        $('aspect-select').disabled = false;
        $('quality-select').disabled = false;
    };

    videoBack.currentTime = 0; videoFront.currentTime = 0;
    await Promise.all([videoBack.play(), videoFront.play()]);
    if (!rafId) startLoop();
    recorder.start(100);
    setStatus(`🔴 Export ${quality} (${dims.w}×${dims.h})... Mohon tunggu.`, 'warning');

    const stopRec = () => {
        if (recorder.state === 'recording') recorder.stop();
        videoBack.pause(); videoFront.pause();
        stopLoop();
    };
    videoBack.addEventListener('ended', stopRec, { once: true });
    setTimeout(stopRec, duration * 1000 + 300);
};

drawFrame();
</script>
</body>
</html>
