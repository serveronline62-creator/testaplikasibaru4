<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Tracking SINDO Express</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; width: 100%; background: #fff; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); padding: 30px; }
        h1 { color: #004a99; font-size: 24px; margin-bottom: 5px; }
        .subtitle { color: #777; font-size: 14px; margin-bottom: 25px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .input-group input { flex: 1; padding: 14px 18px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; transition: border 0.3s; }
        .input-group input:focus { border-color: #004a99; }
        .input-group button { padding: 14px 28px; background: #ff6600; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.3s; }
        .input-group button:hover { background: #e55a00; }
        .error { color: #dc3545; font-size: 14px; min-height: 20px; margin-bottom: 10px; }
        .loading { text-align: center; padding: 30px; display: none; }
        .loading .spinner { width: 40px; height: 40px; border: 4px solid #eee; border-top-color: #ff6600; border-radius: 50%; margin: 0 auto 15px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .result { display: none; margin-top: 20px; }
        .status-banner { background: linear-gradient(135deg, #004a99, #003366); color: #fff; padding: 20px; border-radius: 10px; display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
        .status-icon { font-size: 36px; }
        .status-info h2 { font-size: 22px; margin-bottom: 5px; }
        .status-info p { opacity: 0.85; font-size: 14px; }
        .progress-bar { flex: 1; height: 8px; background: rgba(255,255,255,0.3); border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: #ff6600; border-radius: 10px; width: 0%; transition: width 1s ease; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .info-item { background: #f8f9fa; padding: 14px 18px; border-radius: 8px; }
        .info-item .label { font-size: 11px; text-transform: uppercase; color: #888; letter-spacing: 0.5px; display: block; margin-bottom: 4px; }
        .info-item .value { font-size: 15px; font-weight: 600; color: #333; }
        .timeline { position: relative; padding-left: 30px; }
        .timeline::before { content: ''; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background: #ddd; }
        .timeline-item { position: relative; padding-bottom: 20px; }
        .timeline-item::before { content: ''; position: absolute; left: -26px; top: 4px; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid #ddd; }
        .timeline-item.done::before { border-color: #28a745; background: #28a745; }
        .timeline-item.active::before { border-color: #ff6600; background: #ff6600; box-shadow: 0 0 0 4px rgba(255,102,0,0.2); }
        .timeline-time { font-size: 12px; color: #888; margin-bottom: 2px; }
        .timeline-title { font-size: 14px; font-weight: 600; color: #333; }
        .timeline-desc { font-size: 13px; color: #777; }
        .sample-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .sample-chips button { padding: 6px 14px; border: 1px solid #ddd; background: #fff; border-radius: 20px; font-size: 12px; cursor: pointer; font-family: monospace; transition: all 0.2s; }
        .sample-chips button:hover { background: #004a99; color: #fff; border-color: #004a99; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 Auto Tracking SINDO Express</h1>
        <p class="subtitle">Masukkan nomor resi, sistem akan otomatis memprosesnya</p>

        <div class="input-group">
            <input type="text" id="resiInput" placeholder="Contoh: K2601571-236" autocomplete="off">
            <button id="trackBtn">Lacak</button>
        </div>
        <div class="error" id="errorMsg"></div>

        <div class="sample-chips">
            <span style="font-size:12px;color:#888;align-self:center;">Coba:</span>
            <button data-resi="K2601571-236">K2601571-236</button>
            <button data-resi="SN123456789">SN123456789</button>
            <button data-resi="SN987654321">SN987654321</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="color:#777;">Memproses nomor resi...</p>
        </div>

        <div class="result" id="result">
            <div class="status-banner">
                <div class="status-icon" id="statusIcon">🚚</div>
                <div class="status-info">
                    <h2 id="statusText">-</h2>
                    <p id="statusSub">-</p>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div class="info-grid">
                <div class="info-item"><span class="label">Nomor Resi</span><span class="value" id="resNumber">-</span></div>
                <div class="info-item"><span class="label">Pengirim</span><span class="value" id="resSender">-</span></div>
                <div class="info-item"><span class="label">Penerima</span><span class="value" id="resReceiver">-</span></div>
                <div class="info-item"><span class="label">Asal</span><span class="value" id="resOrigin">-</span></div>
                <div class="info-item"><span class="label">Tujuan</span><span class="value" id="resDestination">-</span></div>
                <div class="info-item"><span class="label">Tanggal Kirim</span><span class="value" id="resDate">-</span></div>
                <div class="info-item"><span class="label">Estimasi Tiba</span><span class="value" id="resEta">-</span></div>
                <div class="info-item"><span class="label">Berat</span><span class="value" id="resWeight">-</span></div>
            </div>

            <h3 style="color:#004a99;margin-bottom:15px;">Riwayat Perjalanan</h3>
            <div class="timeline" id="timeline"></div>
        </div>
    </div>

    <script>
        // ========== DATABASE SIMULASI ==========
        // Format resi SINDO: huruf + angka + tanda hubung, contoh: K2601571-236
        const database = {
            'K2601571-236': {
                resNumber: 'K2601571-236',
                status: 'Dalam Perjalanan',
                statusSub: 'Paket sedang menuju kota tujuan',
                progress: 70,
                sender: 'PT Sinar Indo Pratama',
                receiver: 'Ahmad Wijaya',
                origin: 'Jakarta',
                destination: 'Makassar',
                date: '20 Januari 2026',
                eta: '24 Januari 2026',
                weight: '3.5 kg',
                timeline: [
                    { time: '20 Jan 2026, 08:30', title: 'Paket Dijemput', desc: 'Kurir menjemput paket di Jakarta', status: 'done' },
                    { time: '20 Jan 2026, 15:00', title: 'Masuk Gudang Jakarta', desc: 'Paket diterima di gudang sortir Jakarta', status: 'done' },
                    { time: '21 Jan 2026, 09:00', title: 'Transit di Surabaya', desc: 'Paket transit di gudang Surabaya', status: 'done' },
                    { time: '22 Jan 2026, 06:00', title: 'Dalam Perjalanan ke Makassar', desc: 'Paket sedang dikirim melalui jalur laut', status: 'active' },
                    { time: 'Estimasi 24 Jan 2026', title: 'Tiba di Makassar', desc: 'Paket akan tiba di gudang Makassar', status: 'pending' },
                    { time: 'Estimasi 24 Jan 2026', title: 'Terkirim', desc: 'Paket diterima oleh penerima', status: 'pending' }
                ]
            },
            'SN123456789': {
                resNumber: 'SN123456789',
                status: 'Terkirim',
                statusSub: 'Paket telah diterima',
                progress: 100,
                sender: 'Toko Online ABC',
                receiver: 'Budi Santoso',
                origin: 'Bandung',
                destination: 'Yogyakarta',
                date: '10 Januari 2026',
                eta: '13 Januari 2026',
                weight: '1.2 kg',
                timeline: [
                    { time: '10 Jan 2026, 07:30', title: 'Paket Dijemput', desc: 'Kurir menjemput paket di Bandung', status: 'done' },
                    { time: '10 Jan 2026, 13:00', title: 'Masuk Gudang Bandung', desc: 'Paket diterima di gudang sortir Bandung', status: 'done' },
                    { time: '11 Jan 2026, 10:00', title: 'Transit di Purwokerto', desc: 'Paket transit di Purwokerto', status: 'done' },
                    { time: '12 Jan 2026, 08:00', title: 'Tiba di Yogyakarta', desc: 'Paket tiba di gudang Yogyakarta', status: 'done' },
                    { time: '13 Jan 2026, 14:00', title: 'Terkirim', desc: 'Paket diterima oleh Budi Santoso', status: 'done' }
                ]
            },
            'SN987654321': {
                resNumber: 'SN987654321',
                status: 'Menunggu Pickup',
                statusSub: 'Paket belum dijemput kurir',
                progress: 10,
                sender: 'CV Karya Mandiri',
                receiver: 'Siti Aminah',
                origin: 'Medan',
                destination: 'Palembang',
                date: '22 Januari 2026',
                eta: '26 Januari 2026',
                weight: '2.0 kg',
                timeline: [
                    { time: '22 Jan 2026, 10:00', title: 'Pesanan Dibuat', desc: 'Data pengiriman diterima sistem', status: 'done' },
                    { time: '22 Jan 2026, 10:30', title: 'Menunggu Penjemputan', desc: 'Paket akan dijemput oleh kurir', status: 'active' },
                    { time: 'Estimasi 23 Jan 2026', title: 'Paket Dijemput', desc: 'Kurir akan menjemput paket', status: 'pending' },
                    { time: 'Estimasi 26 Jan 2026', title: 'Terkirim', desc: 'Paket diterima oleh penerima', status: 'pending' }
                ]
            }
        };

        // ========== ELEMEN ==========
        const resiInput = document.getElementById('resiInput');
        const trackBtn = document.getElementById('trackBtn');
        const errorMsg = document.getElementById('errorMsg');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');

        // ========== FUNGSI OTOMATIS ==========
        // Deteksi otomatis saat user mengetik (debounce)
        let typingTimer;
        resiInput.addEventListener('input', function() {
            clearTimeout(typingTimer);
            const val = this.value.trim();
            errorMsg.textContent = '';

            // Jika format resi valid (minimal 6 karakter, ada huruf & angka), auto-lacak setelah 800ms
            if (val.length >= 6) {
                typingTimer = setTimeout(() => {
                    if (/[A-Za-z]/.test(val) && /[0-9]/.test(val)) {
                        autoTrack(val);
                    }
                }, 800);
            }
        });

        // Enter key
        resiInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                clearTimeout(typingTimer);
                autoTrack(this.value.trim());
            }
        });

        // Tombol manual
        trackBtn.addEventListener('click', function() {
            clearTimeout(typingTimer);
            autoTrack(resiInput.value.trim());
        });

        // Sample chips
        document.querySelectorAll('.sample-chips button').forEach(btn => {
            btn.addEventListener('click', function() {
                resiInput.value = this.dataset.resi;
                clearTimeout(typingTimer);
                autoTrack(this.dataset.resi);
            });
        });

        // ========== FUNGSI UTAMA TRACKING ==========
        function autoTrack(resi) {
            if (!resi) {
                errorMsg.textContent = 'Silakan masukkan nomor resi.';
                return;
            }

            // Validasi format: huruf + angka, boleh ada tanda hubung
            if (!/^[A-Za-z0-9\-]+$/.test(resi)) {
                errorMsg.textContent = 'Format nomor resi tidak valid.';
                return;
            }

            errorMsg.textContent = '';
            result.style.display = 'none';
            loading.style.display = 'block';

            // Simulasi proses request (delay 1 detik)
            setTimeout(() => {
                loading.style.display = 'none';

                // Cari di database
                const data = database[resi.toUpperCase()];

                if (!data) {
                    errorMsg.textContent = '❌ Nomor resi "' + resi + '" tidak ditemukan. Coba contoh yang tersedia.';
                    return;
                }

                // Tampilkan hasil
                renderResult(data);
            }, 1000);
        }

        // ========== RENDER HASIL ==========
        function renderResult(data) {
            // Status banner
            document.getElementById('statusText').textContent = data.status;
            document.getElementById('statusSub').textContent = data.statusSub;

            // Icon berdasarkan status
            const iconMap = { 'Terkirim': '✅', 'Dalam Perjalanan': '🚚', 'Menunggu Pickup': '⏳' };
            document.getElementById('statusIcon').textContent = iconMap[data.status] || '📦';

            // Progress
            const fill = document.getElementById('progressFill');
            fill.style.width = '0%';
            setTimeout(() => { fill.style.width = data.progress + '%'; }, 100);

            // Info grid
            document.getElementById('resNumber').textContent = data.resNumber;
            document.getElementById('resSender').textContent = data.sender;
            document.getElementById('resReceiver').textContent = data.receiver;
            document.getElementById('resOrigin').textContent = data.origin;
            document.getElementById('resDestination').textContent = data.destination;
            document.getElementById('resDate').textContent = data.date;
            document.getElementById('resEta').textContent = data.eta;
            document.getElementById('resWeight').textContent = data.weight;

            // Timeline
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = '';
            data.timeline.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'timeline-item ' + (item.status === 'done' ? 'done' : item.status === 'active' ? 'active' : '');
                div.innerHTML = `
                    <div class="timeline-time">${item.time}</div>
                    <div class="timeline-title">${item.title}</div>
                    <div class="timeline-desc">${item.desc}</div>
                `;
                timeline.appendChild(div);

                // Animasi stagger
                div.style.opacity = '0';
                div.style.transform = 'translateX(-10px)';
                setTimeout(() => {
                    div.style.transition = 'all 0.3s ease';
                    div.style.opacity = '1';
                    div.style.transform = 'translateX(0)';
                }, i * 80);
            });

            result.style.display = 'block';
        }

        // ========== INISIALISASI ==========
        // Set example resi K2601571-236 sebagai default untuk demo otomatis
        // Uncomment baris di bawah jika ingin auto-track saat halaman dimuat:
        // window.addEventListener('load', () => { resiInput.value = 'K2601571-236'; autoTrack('K2601571-236'); });
    </script>
</body>
</html>
